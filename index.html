<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ani_Random</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Stack+Sans+Notch:wght@200..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="web_logo.jpeg">
  </head>
  <body>
    <header id="title_head">
      <div id="title">Ani_Random</div>
    </header>
    <main id="site_body">
      <div id="anime_image"></div>
      <div id="anime_info">
        <div id="anime_titles">
          English Name
          <div id="anime_english_title"></div>
          Japanese Name
          <div id="anime_japanese_title"></div>
          Nihon Name
          <div id="anime_nihon_title"></div>
          Score
          <div id="anime_score"></div>
          <div id="score_stars"></div>
          Release Year
          <div id="anime_release_year"></div>
          URL
          <div id="anime_url"></div>
        </div>
      </div>
    </main>
    <footer>
      <center>
        <div id="generate_button" onclick="getAnimeInfo()" class="scramble">Generate_Random
        </div>
      </center>
    </footer>
    <script src = "script.js"></script>
  </body>
</html>
